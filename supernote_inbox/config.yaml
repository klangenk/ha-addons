name: Supernote Convert
version: "1.0.0"
slug: supernote_inbox
description: >-
  Read-only HTTP service that turns a Supernote .note file into its pages -
  recognised text where the device has it, PNG where it does not.
url: https://github.com/klangenk/ha-addons
arch:
  # armv7 is left out on purpose: numpy publishes no armv7 wheels, so the
  # build would fall back to compiling it. Home Assistant OS on a Pi 4 is
  # aarch64 anyway.
  - aarch64
  - amd64
init: true
startup: services
boot: auto

ports:
  8099/tcp: null
ports_description:
  8099/tcp: >-
    Conversion API (read-only, Bearer token). Left closed by default: n8n sits
    on the same Docker network and reaches it by hostname, so publishing it to
    the LAN is only needed for debugging from a browser. Pick a free host port
    if you do - the Supervisor refuses to start the add-on if the host port is
    already taken.

options:
  api_token: ""
  log_level: "info"
schema:
  api_token: password
  log_level: list(debug|info|warning)
